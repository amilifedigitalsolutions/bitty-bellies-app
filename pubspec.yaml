name: bitty_bellies
description: Bitty Bellies — a recipe app where parents share what's worked for their families, from around the world.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^17.0.0

  # AWS Amplify
  amplify_flutter: ^2.5.1
  amplify_auth_cognito: ^2.5.1
  amplify_api: ^2.5.1
  amplify_storage_s3: ^2.5.1

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  flutter_staggered_grid_view: ^0.7.0

  # Forms / validation
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.0.0

  # Utilities
  intl: ^0.20.0
  uuid: ^4.4.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^9.2.2
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  logging: ^1.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/logos/
